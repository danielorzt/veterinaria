<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Veterinaria</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="imagenes/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link
      href="https://cdn.datatables.net/v/bs5/jszip-3.10.1/dt-2.0.5/b-3.0.2/b-colvis-3.0.2/b-html5-3.0.2/b-print-3.0.2/fc-5.0.0/r-3.0.2/datatables.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.datatables.net/v/bs5/jszip-3.10.1/dt-2.0.5/b-3.0.2/b-colvis-3.0.2/b-html5-3.0.2/b-print-3.0.2/fc-5.0.0/r-3.0.2/datatables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Add this line -->
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="vista/css/main.css"
    />
  </head>
  <body>
    <div class="container">
      <h2>Registro de Mascotas</h2>
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="txtNombreMascota" class="form-label"
              >Nombre de la Mascota</label
            >
            <input
              type="text"
              class="form-control"
              id="txtNombreMascota"
              placeholder="Nombre"
            />
          </div>
          <div class="mb-3">
            <label for="txtEdadMascota" class="form-label">Edad</label>
            <input
              type="text"
              class="form-control"
              id="txtEdadMascota"
              placeholder="Edad"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Sexo</label>
            <div>
              <input
                type="radio"
                id="sexoMacho"
                name="sexoMascota"
                value="Macho"
              />
              <label for="sexoMacho">Macho</label>
              <input
                type="radio"
                id="sexoHembra"
                name="sexoMascota"
                value="Hembra"
              />
              <label for="sexoHembra">Hembra</label>
            </div>
          </div>
          <div class="mb-3">
            <label for="selectRazaMascota" class="form-label">Raza</label>
            <select class="form-control" id="selectRazaMascota">
              <!-- Options will be populated dynamically -->
            </select>
          </div>
          <div class="mb-3">
            <label for="txtNombreDueno" class="form-label"
              >Nombre del Dueño</label
            >
            <input
              type="text"
              class="form-control"
              id="txtNombreDueno"
              placeholder="Nombre del Dueño"
            />
          </div>
          <div class="mb-3">
            <label for="txtTelefonoDueno" class="form-label"
              >Teléfono del Dueño</label
            >
            <input
              type="text"
              class="form-control"
              id="txtTelefonoDueno"
              placeholder="Teléfono"
            />
          </div>
          <button class="btn btn-dark" id="btnRegistrarMascota" type="button">
            Registrar Mascota
          </button>
        </div>
        <div class="col-md-6">
          <div class="table-responsive">
            <table
              id="tablaMascotas"
              class="table table-hover"
              style="width: 100%"
            >
              <thead class="table-dark">
                <tr>
                  <th scope="col">Nombre Mascota</th>
                  <th scope="col">Edad</th>
                  <th scope="col">Sexo</th>
                  <th scope="col">Raza</th>
                  <th scope="col">Nombre del Dueño</th>
                  <th scope="col">Teléfono del Dueño</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody id="cuerpoTablaMascotas"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <!-- The Modal -->
    <div class="modal" id="modalEditarMascota">
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">Editar Mascota</h4>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <!-- Modal body -->
          <div class="modal-body">
            <div class="">
              <div class="form-control">
                <input
                  type="text"
                  class="form-control mt-2"
                  id="txtEditarNombreMascota"
                  placeholder="Nombre"
                />
                <input
                  type="text"
                  class="form-control mt-2"
                  id="txtEditarEdadMascota"
                  placeholder="Edad"
                />
                <div class="mt-2">
                  <input
                    type="radio"
                    id="editarSexoMacho"
                    name="editarSexoMascota"
                    value="Macho"
                  />
                  <label for="editarSexoMacho">Macho</label>
                  <input
                    type="radio"
                    id="editarSexoHembra"
                    name="editarSexoMascota"
                    value="Hembra"
                  />
                  <label for="editarSexoHembra">Hembra</label>
                </div>
                <select class="form-control mt-2" id="selectEditarRazaMascota">
                  <!-- Options will be populated dynamically -->
                </select>
                <input
                  type="text"
                  class="form-control mt-2"
                  id="txtEditarNombreDueno"
                  placeholder="Nombre Dueño"
                />
                <input
                  type="text"
                  class="form-control mt-2"
                  id="txtEditarTelefonoDueno"
                  placeholder="Teléfono Dueño"
                />
                <button
                  class="btn btn-danger mt-2"
                  id="btnEditarMascota"
                  type="button"
                >
                  Aceptar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="vista/js/main.js"></script>
  </body>
</html>
